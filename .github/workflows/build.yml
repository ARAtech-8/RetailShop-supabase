name: Build from zip

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          mkdir -p src_unzipped
          unzip -q "$(ls *.zip | head -1)" -d src_unzipped
          ls src_unzipped

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: gradle -p src_unzipped/TuckShopManager :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TuckShopManager-debug-apk
          path: src_unzipped/TuckShopManager/app/build/outputs/apk/debug/app-debug.apk
